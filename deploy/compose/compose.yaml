name: bag
x-app: &app
  image: bag-api:local
  build:
    context: ../..
    dockerfile: deploy/compose/Dockerfile
  environment:
    BAG_DATABASE_URL: postgresql://${POSTGRES_USER:-bag}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-bag}
    BAG_USER_NAME: ${BAG_USER_NAME:-My Bag}
    BAG_MAX_REQUEST_BYTES: ${BAG_MAX_REQUEST_BYTES:-1048576}
    BAG_MAX_UPLOAD_BYTES: ${BAG_MAX_UPLOAD_BYTES:-52428800}
    BAG_STORAGE_PATH: /data/storage
    BAG_WORKER_PORT: ${BAG_WORKER_PORT:-8001}
    BAG_WORKER_POLL_SECONDS: ${BAG_WORKER_POLL_SECONDS:-1.0}
    BAG_JOB_LEASE_SECONDS: ${BAG_JOB_LEASE_SECONDS:-300}
    BAG_JOB_MAX_ATTEMPTS: ${BAG_JOB_MAX_ATTEMPTS:-5}
    BAG_JOB_RETRY_SECONDS: ${BAG_JOB_RETRY_SECONDS:-5.0}
    BAG_TRASH_RETENTION_DAYS: ${BAG_TRASH_RETENTION_DAYS:-30}
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped
  volumes:
    - bag-storage:/data/storage

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bag}
    ports:
      - "127.0.0.1:${BAG_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  bag-api:
    <<: *app
    ports:
      - "127.0.0.1:${BAG_API_PORT:-8000}:8000"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      timeout: 6s
      retries: 3
  bag-worker:
    <<: *app
    command: [bag, worker]
    healthcheck:
      test: [CMD, python, -c, "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['BAG_WORKER_PORT'] + '/ready')"]
      interval: 10s
      timeout: 6s
      retries: 3

volumes:
  postgres-data:
  bag-storage:

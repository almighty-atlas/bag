name: Quality
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bag
          POSTGRES_PASSWORD: bag-test
          POSTGRES_DB: bag_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bag -d bag_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      BAG_TEST_DATABASE_URL: postgresql://bag:bag-test@127.0.0.1:5432/bag_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv build
      - run: docker build -f deploy/compose/Dockerfile -t bag-api:ci .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: docker build -f deploy/compose/Dockerfile.web -t bag-web:ci .
      - run: scripts/e2e.sh
        env:
          E2E_PG_PORT: "15432"
